name: build

on:
  push:
    branches:
      - main
    paths:
      - "source/**"

permissions:
  contents: write

concurrency:
  group: dist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-36
            build-tools;36.0.0

      - name: Build release APK
        run: ./gradlew --no-daemon :src:zh:guazimanhua:assembleRelease

      - name: Sign APK
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          APK=$(ls src/zh/guazimanhua/build/outputs/apk/release/*.apk)
          STORE_PASS="${KEY_STORE_PASSWORD:-guazi123}"
          KEY_PASS="${KEY_PASSWORD:-guazi123}"
          ALIAS_NAME="${ALIAS:-guazi}"
          jarsigner -keystore signingkey.jks -storepass "$STORE_PASS" -keypass "$KEY_PASS" "$APK" "$ALIAS_NAME"

      - name: Regenerate repo index
        working-directory: .
        run: |
          python -m pip install --quiet grpcio grpcio-tools
          APK=$(ls source/src/zh/guazimanhua/build/outputs/apk/release/*.apk)
          BASE=$(basename "$APK")
          mkdir -p apk
          cp "$APK" apk/"$BASE"
          python tools/build_index.py \
            --source-info "source/src/zh/guazimanhua/build/keiyoushi-source-info.json" \
            --apk "apk/$BASE"

      - name: Commit updated dist
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f index.min.json index.pb apk/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "dist: rebuild extension"
            git push
          fi