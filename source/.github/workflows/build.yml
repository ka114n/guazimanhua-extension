name: build

on:
  push:
    branches:
      - main
    paths:
      - "source/**"

permissions:
  contents: write

concurrency:
  group: dist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-36
            build-tools;36.0.0

      - name: Build release APKs
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || 'guazi123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'guazi123' }}
          ALIAS: ${{ secrets.ALIAS || 'guazi' }}
        run: ./gradlew --no-daemon :src:zh:guazimanhua:assembleRelease :src:zh:copy3000:assembleRelease

      - name: Sign APKs
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          STORE_PASS="${KEY_STORE_PASSWORD:-guazi123}"
          KEY_PASS="${KEY_PASSWORD:-guazi123}"
          ALIAS_NAME="${ALIAS:-guazi}"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for APK in src/zh/guazimanhua/build/outputs/apk/release/*.apk \
                     src/zh/copy3000/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" sign --ks signingkey.jks --ks-pass "pass:$STORE_PASS" \
              --key-pass "pass:$KEY_PASS" --ks-key-alias "$ALIAS_NAME" "$APK"
          done

      - name: Regenerate repo index
        working-directory: .
        run: |
          python -m pip install --quiet grpcio grpcio-tools
          mkdir -p apk
          for APK in source/src/zh/guazimanhua/build/outputs/apk/release/*.apk \
                     source/src/zh/copy3000/build/outputs/apk/release/*.apk; do
            BASE=$(basename "$APK")
            cp "$APK" apk/"$BASE"
          done
          python tools/build_index.py --store \
            --source-info source/src/zh/guazimanhua/build/keiyoushi-source-info.json \
            --source-info source/src/zh/copy3000/build/keiyoushi-source-info.json \
            --apk apk/tachiyomi-zh.guazimanhua-v1.4.1.apk \
            --apk apk/tachiyomi-zh.copy3000-v1.4.1.apk

      - name: Commit updated dist
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f index.min.json index.pb index-store.json apk/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "dist: rebuild extensions"
            git push
          fi